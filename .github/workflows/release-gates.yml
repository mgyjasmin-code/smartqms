name: SmartQMS release gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          MARIADB_DATABASE: smartqms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, intl, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Validate dependencies
        run: |
          composer validate --no-check-publish
          composer audit --locked
      - name: Validate PHP syntax
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Prepare isolated test database
        run: |
          sudo apt-get update -qq && sudo apt-get install -y mariadb-client
          sed -e 's/CREATE DATABASE IF NOT EXISTS smartqms/CREATE DATABASE IF NOT EXISTS smartqms_test/' -e 's/USE smartqms;/USE smartqms_test;/' database/smartqms_final_v4.sql | mariadb --protocol=tcp --host=127.0.0.1 --user=root
          mariadb --protocol=tcp --host=127.0.0.1 --user=root smartqms_test < database/migrations/20260905_001_production_security.sql
          cp tests/config.example.php tests/config.local.php
          sed -i "s/'localhost'/'127.0.0.1'/" tests/config.local.php
      - name: Run PHP and JavaScript contracts
        run: |
          php tests/php/run.php
          node tests/js/run.js
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/admin.js
          node --check assets/js/staff.js
          node --check assets/js/public_display.js

  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r ml/requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: smartqms.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: smartqms-sbom
          path: smartqms.spdx.json
